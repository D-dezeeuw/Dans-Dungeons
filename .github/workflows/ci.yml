# Test gate. Nothing merges — and nothing deploys — on a red suite.
#
# Before this workflow the deployed product had no CI at all: production was a
# push to main carrying a locally built, committed bundle that nothing verified
# against src/. The vendored-engine chimera and the never-rendered chip layer
# both reached players that way.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev dependencies (esbuild only)
        run: npm ci || npm install

      - name: Unit tests
        run: npm test

      - name: Vendored libraries match their manifests
        run: node scripts/vendor-sync.js --check

      - name: Bundle builds
        run: node build.js

      # The committed bundle is what GitHub Pages serves, so a stale one ships
      # source that no longer matches the game. Rebuilding must be a no-op.
      - name: Committed bundle is up to date
        run: |
          if ! git diff --quiet -- vendor/app.bundle.js; then
            echo "::error::vendor/app.bundle.js is stale — run 'node build.js' and commit the result."
            git diff --stat -- vendor/app.bundle.js
            exit 1
          fi

  # The browser layer. Separate job so a Playwright install can never slow down
  # or destabilise the zero-dependency unit gate — and so a red e2e run points
  # at the browser, not at the logic.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev dependencies
        run: npm ci || npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Serves the committed bundle exactly as GitHub Pages does — which is the
      # point: the defect this layer exists for (a chip layer that rendered
      # nothing) was invisible to every test that did not open a browser.
      - name: Smoke tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
